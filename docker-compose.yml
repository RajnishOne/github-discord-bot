services:
  github-discord-bot:
    image: ghcr.io/rajnishone/github-discord-bot:latest
    container_name: github-discord-bot
    restart: unless-stopped

    environment:
      - PUID=1000
      - PGID=100
      - TZ=Asia/Kolkata
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
      - GITHUB_OWNER=${GITHUB_OWNER:-RajnishOne}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - DEFAULT_POLLING_INTERVAL=${DEFAULT_POLLING_INTERVAL:-300}

    volumes:
      - ${DATA_PATH:-/docker-data/github-discord-bot/data}:/app/data

    ports:
      - 3000:3000

    dns:
      - 1.1.1.1
      - 8.8.8.8

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - default
      - proxy

networks:
  proxy:
    external: true
